repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.3.1
    hooks:
      - id: betterleaks
        args: [--max-archive-depth, "3"]

  - repo: local
    hooks:
      - id: no-real-report-data
        name: Block real report values (public repo)
        entry: uv run python -m scripts.check_real_data
        language: system
        types: [text]
        exclude: '(^|/)(uv\.lock|package-lock\.json)$'
        stages: [pre-commit]
      - id: no-real-report-data-msg
        name: Block real report values in commit message
        entry: uv run python -m scripts.check_real_data --commit-msg
        language: system
        stages: [commit-msg]
