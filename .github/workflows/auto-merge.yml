name: Auto-merge Dependabot

# Auto-approve and enable squash auto-merge for Dependabot PRs that are
# patch/minor bumps or security updates. Major bumps require manual review.
# Repo settings must have "Allow auto-merge" enabled and branch protection
# requiring CI to pass — auto-merge waits for status checks then merges.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      - name: Approve PR (non-major)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR_URL"

      - name: Enable auto-merge (non-major)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Note major bump (manual review)
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "Major bump for ${{ steps.meta.outputs.dependency-names }} — leaving for manual review."
